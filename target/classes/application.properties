server.port=8081
spring.application.name=ai-newsletter

# --- LLM: Groq ---
llm.base-url=https://api.groq.com/openai/v1
llm.api-key=${GROQ_API_KEY}
llm.model=openai/gpt-oss-20b
llm.reasoning-effort=low
llm.max-input-chars=3000
llm.max-output-tokens=600

# --- Gmail SMTP ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
newsletter.mail.from=${GMAIL_USERNAME}
newsletter.mail.subject=Daily AI News